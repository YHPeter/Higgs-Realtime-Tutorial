[project]
name = "higgs-pipecat-tutorial"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[runner,webrtc]==1.12.0",
    "pipecat-boson",
    "python-dotenv",
    "aiohttp",
]

[tool.uv]
package = false

[tool.uv.sources]
# boson-ai/pipecat-boson#10 makes the playground show the bot's replies. Switch
# to the PyPI release (pipecat-boson>=0.1.4) once it is published.
pipecat-boson = { git = "https://github.com/YHPeter/pipecat-boson", rev = "8cb97574d4e0a89764f9a939a45aeefeb81fa6d9" }

[tool.ruff]
line-length = 119
